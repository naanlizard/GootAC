[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

# Required for HomeKit memory optimization
board_build.f_cpu = 160000000L
build_flags =
    -D HOMEKIT_LOG_LEVEL=2
    -D ARDUINO_HOMEKIT_LOWROM
    -D ARDUINO_HOMEKIT_SKIP_ED25519_VERIFY
    -D APP_LOG_LEVEL=4
build_src_filter = +<*> -<HeatPumpFake.cpp>

lib_deps =
    # HomeKit library is vendored in lib/HomeKit-ESP8266 (dkerr64 a917a71 plus a
    # legacy-storage read shim); no URL pin, the previous one died with its fork.
    # Logging
    https://github.com/thijse/Arduino-Log.git

# Hardware-free diagnostic build: swaps HeatPump.cpp for HeatPumpFake.cpp,
# forces HomeKit to start without a CN105 handshake, and overrides
# DEVICE_NAME so this unit can never collide with a production GootAC.
[env:d1_mini_fake]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -D USE_FAKE_HEATPUMP
build_src_filter = +<*> -<HeatPump.cpp>

# Serves the HomeKit library's own logs at /hklog. The library only writes them
# to Serial, which is unreachable on an installed unit, so this is the way to
# diagnose pairing and session failures in place. Costs ~4KB RAM plus the DEBUG
# strings in flash, so it stays off for fleet builds.
[env:d1_mini_hklog]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -D GOOTAC_HK_LOG
    -D HOMEKIT_USE_RATGDO_LOG
