[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

# Required for HomeKit memory optimization
board_build.f_cpu = 160000000L
build_flags =
    -D HOMEKIT_LOG_LEVEL=2
    -D ARDUINO_HOMEKIT_LOWROM
    -D ARDUINO_HOMEKIT_SKIP_ED25519_VERIFY
    -D APP_LOG_LEVEL=4
build_src_filter = +<*> -<HeatPumpFake.cpp>

lib_deps =
    # HomeKit Library — upstream Mixiaoxiao @ HEAD with only our keepAlive
    # null-guard applied on top, hosted on naanlizard's fork.
    #
    # v1.15 briefly pinned to b2f831b (cherry-pick of dkerr64's f22abab "Fix
    # complete annihilation of storage on new pair"), but the cherry-picked
    # commit introduced its own brick bug: storage.c's new
    # homekit_storage_reset_pairing_data() calls spiflash_write(PAIRINGS_OFFSET, ...)
    # using the relative offset 128 instead of the absolute PAIRINGS_ADDR.
    # spiflash_write takes an absolute flash address, so the call wipes 1280
    # bytes at flash byte 128 — inside the sketch region. compact_data() reaches
    # this path on every pair-add following a prior pair-remove (remove_pairing
    # bzeros the slot, so find_empty_block then returns -1 and compaction runs).
    # Bricked Simples (192.168.1.56) during a unpair/re-add cycle. Reverting
    # to 3db38771 here; bug filed upstream.
    https://github.com/naanlizard/Arduino-HomeKit-ESP8266.git#3db38771c236304d6dad74ba484e0017d8de1782
    # Status and State Persistence
    bblanchon/ArduinoJson@^6.21.3
    # Logging
    https://github.com/thijse/Arduino-Log.git

# Hardware-free diagnostic build: swaps HeatPump.cpp for HeatPumpFake.cpp,
# forces HomeKit to start without a CN105 handshake, and overrides
# DEVICE_NAME so this unit can never collide with a production GootAC.
[env:d1_mini_fake]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -D USE_FAKE_HEATPUMP
build_src_filter = +<*> -<HeatPump.cpp>
