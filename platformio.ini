[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

# Required for HomeKit memory optimization
board_build.f_cpu = 160000000L
build_flags =
    -D HOMEKIT_LOG_LEVEL=2
    -D ARDUINO_HOMEKIT_LOWROM
    -D ARDUINO_HOMEKIT_SKIP_ED25519_VERIFY
    -D APP_LOG_LEVEL=4
build_src_filter = +<*> -<HeatPumpFake.cpp>

lib_deps =
    # HomeKit Library — upstream Mixiaoxiao + targeted dkerr64 cherry-picks
    # on naanlizard's fork. Pin to a specific SHA so behavior is reproducible.
    # b2f831b adds dkerr64's f22abab "Fix complete annihilation of storage on
    # new pair" which (a) guards write() against being called on a context
    # already in disconnect state — addresses the Exception-9 crash observed
    # at write()'s epilogue on Simples + Suite — (b) replaces homekit_storage_
    # reset() in compact_data() with a pairings-only wipe, preserving
    # accessory_id / accessory_key across pairing compactions, and (c) bumps
    # HK lib's internal log level to DEBUG for more crash-path visibility.
    https://github.com/naanlizard/Arduino-HomeKit-ESP8266.git#b2f831b2ad94f21ed83b1439288e2f2fdb0afd69
    # Status and State Persistence
    bblanchon/ArduinoJson@^6.21.3
    # Logging
    https://github.com/thijse/Arduino-Log.git

# Hardware-free diagnostic build: swaps HeatPump.cpp for HeatPumpFake.cpp,
# forces HomeKit to start without a CN105 handshake, and overrides
# DEVICE_NAME so this unit can never collide with a production GootAC.
[env:d1_mini_fake]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -D USE_FAKE_HEATPUMP
build_src_filter = +<*> -<HeatPump.cpp>
