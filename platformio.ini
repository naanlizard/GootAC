[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

# Required for HomeKit memory optimization
board_build.f_cpu = 160000000L
build_flags =
    -D HOMEKIT_LOG_LEVEL=2
    -D ARDUINO_HOMEKIT_LOWROM
    -D ARDUINO_HOMEKIT_SKIP_ED25519_VERIFY
    -D APP_LOG_LEVEL=4
build_src_filter = +<*> -<cn105_timing_test.cpp> -<HeatPumpFake.cpp>

lib_deps =
    # HomeKit Library — dkerr64's fork of the abandoned Mixiaoxiao lib,
    # pinned to a specific commit for reproducible builds. dkerr64 is 52
    # commits ahead of upstream and includes fixes that aren't in upstream:
    # base64 namespace rename, mDNS-restart-on-WiFi-reconnect, storage
    # alignment, and (critically for our use) a localIP/remoteIP.isSet()
    # guard in homekit_server_accept_client that prevents the NULL-deref
    # crash in WiFiClient::keepAlive when the remote RST/FINs during accept.
    https://github.com/dkerr64/Arduino-HomeKit-ESP8266.git#ec2c3b13d9c25c86c8f753f369b24dbc9422df48
    # Status and State Persistence
    bblanchon/ArduinoJson@^6.21.3
    # Logging
    https://github.com/thijse/Arduino-Log.git

# Hardware-free diagnostic build: swaps HeatPump.cpp for HeatPumpFake.cpp,
# forces HomeKit to start without a CN105 handshake, and overrides
# DEVICE_NAME so this unit can never collide with a production GootAC.
[env:d1_mini_fake]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -D USE_FAKE_HEATPUMP
build_src_filter = +<*> -<cn105_timing_test.cpp> -<HeatPump.cpp>
