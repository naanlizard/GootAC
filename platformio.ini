[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

# Required for HomeKit memory optimization
board_build.f_cpu = 160000000L
build_flags =
    -D HOMEKIT_LOG_LEVEL=2
    -D ARDUINO_HOMEKIT_LOWROM
    -D ARDUINO_HOMEKIT_SKIP_ED25519_VERIFY
    -D APP_LOG_LEVEL=4
build_src_filter = +<*> -<cn105_timing_test.cpp> -<HeatPumpFake.cpp>

lib_deps =
    # HomeKit Library — upstream Mixiaoxiao @ HEAD with only our keepAlive
    # null-guard applied on top, hosted on naanlizard's fork. We previously
    # tried dkerr64's fork (52 commits ahead with various fixes) but it
    # introduced a pair-setup regression (M2/M6 signature verification
    # failures), preventing new HomeKit pairings. This branch is the minimal
    # delta from upstream HEAD needed to avoid the WiFiClient::keepAlive
    # NULL-deref crash on TCP RST/FIN race.
    https://github.com/naanlizard/Arduino-HomeKit-ESP8266.git#2c0a808323f3ed03466f694b45982e754e3fd4f8
    # Status and State Persistence
    bblanchon/ArduinoJson@^6.21.3
    # Logging
    https://github.com/thijse/Arduino-Log.git

# Hardware-free diagnostic build: swaps HeatPump.cpp for HeatPumpFake.cpp,
# forces HomeKit to start without a CN105 handshake, and overrides
# DEVICE_NAME so this unit can never collide with a production GootAC.
[env:d1_mini_fake]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    -D USE_FAKE_HEATPUMP
build_src_filter = +<*> -<cn105_timing_test.cpp> -<HeatPump.cpp>
